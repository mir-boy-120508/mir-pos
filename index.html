<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f4ee">
  <title>ミール POSレジ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">ミ</div>
        <div>
          <div class="brand-name">小さなパン工房ミール</div>
          <div class="brand-sub">POSレジ</div>
        </div>
      </div>
      <div class="status">
        <span class="status-dot"></span>
        オンライン
      </div>
      <button class="top-btn" id="clearBtn">新しい会計</button>
    </header>

    <main class="workspace">
      <aside class="receipt-panel">
        <div class="receipt-head">
          <div>
            <div class="eyebrow">現在の伝票</div>
            <h1>お会計</h1>
          </div>
          <button class="icon-btn" id="clearBtn2" title="伝票をクリア">×</button>
        </div>

        <div class="ticket-info">
          <span>一般会計</span>
          <span id="itemCount">0点</span>
        </div>

        <div class="cart" id="cart">
          <div class="empty-cart">
            <div class="empty-icon">🛍️</div>
            <strong>商品を選択してください</strong>
            <span>右側の商品パネルをタップすると<br>ここに追加されます。</span>
          </div>
        </div>

        <div class="receipt-summary">
          <div><span>小計</span><strong id="subtotal">¥0</strong></div>
          <div><span>税</span><strong id="tax">¥0</strong></div>
          <div class="grand"><span>合計</span><strong id="total">¥0</strong></div>
        </div>

        <button class="checkout-btn" id="checkoutBtn" disabled>
          <span>会計へ</span>
          <strong id="checkoutAmount">¥0</strong>
        </button>
      </aside>

      <section class="catalog">
        <div class="catalog-head">
          <div>
            <div class="eyebrow">商品を選択</div>
            <h2 id="categoryTitle">ドーナツ</h2>
          </div>
          <div class="search-wrap">
            <span>⌕</span>
            <input id="search" type="search" placeholder="商品を検索">
          </div>
        </div>

        <nav class="categories" id="categories"></nav>
        <div class="products" id="products"></div>
      </section>
    </main>
  </div>

  <div class="modal-backdrop" id="checkoutModal" hidden>
    <div class="modal">
      <button class="modal-close" id="modalClose">×</button>
      <div class="eyebrow">お会計</div>
      <h2>お支払い方法</h2>
      <div class="modal-total" id="modalTotal">¥0</div>
      <div class="payment-grid">
        <button class="payment-btn" data-payment="現金"><span>💴</span>現金</button>
        <button class="payment-btn" data-payment="クレジット"><span>💳</span>クレジット</button>
        <button class="payment-btn" data-payment="その他"><span>•••</span>その他</button>
      </div>
      <div class="complete" id="completeMessage" hidden>
        <div class="complete-icon">✓</div>
        <strong>会計が完了しました</strong>
        <span id="completeDetail"></span>
        <button id="newTicketBtn">新しい会計</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="script.js"></script>
</body>
</html>
